# Э15 (ТЗ ч.2): код-агент на 15 задачах с автоматическими проверками (evalsets/code_v1.yaml).
# H13 — цикл исправления по результатам исполнения повышает долю решённых задач (одна попытка против 5).
# H14 — инструменты правки ACI уменьшают число испорченных файлов (против перезаписи файла целиком).
name: e15-code
tasks: ../../evalsets/code_v1.yaml
runs:
  - name: "цикл исправления (до 5 неудачных запусков), ACI (по умолчанию)"
    overrides: {}
  - name: "H13: одна попытка"
    overrides: {code: {max_iterations: 1}}
  - name: "H14: перезапись файлов вместо ACI"
    overrides: {code: {aci: false}}
