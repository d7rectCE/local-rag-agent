# Default configuration. Any key can be overridden with an environment variable
# RAG__<SECTION>__<KEY>, e.g. RAG__LLM__MODEL=qwen3.6:27b, or by pointing
# RAG_CONFIG to another YAML file.

corpus:
  include_ext: [".py", ".ipynb", ".pdf", ".docx", ".txt", ".md", ".log"]   # .doc needs LibreOffice; .png — Э5
  # Glob patterns. A pattern without "/" matches any path component
  # (directory or file name); a pattern with "/" matches the relative path.
  exclude:
    - ".git"
    - "__pycache__"
    - ".ipynb_checkpoints"
    - "node_modules"
    - ".venv"
    - "venv"
    - "site-packages"
    - "*.egg-info"
    - "Аккаунты"
  skip_hidden: true                   # skip files and folders starting with "."
  max_file_mb: 20

storage:
  data_dir: "~/.local-rag-agent"      # indexes, catalogs and traces live here, outside the repo
  qdrant_url: null                    # null = embedded local Qdrant; or http://localhost:6333

chunking:
  python: ast                         # ast (Э3, default) | lines (Э1 baseline); see reports/e3_ablations.md
  lines_per_chunk: 60
  overlap_lines: 10
  ast_max_chars: 1800                 # AST chunk budget, non-whitespace characters (cAST)
  max_chunk_chars: 6000
  output_max_chars: 2000              # notebook outputs are truncated, keeping the tail
  context_header: true                # prepend file path / title / section / enclosing class to the embedded text
  notebook_context: true              # notebook title and heading path in every cell's header
  text_max_chars: 1500                # prose chunks of PDF / DOCX / TXT, cut at paragraph boundaries
  docx: structured                    # structured (headings, tables, revisions, comments) | plain (H10 baseline)

documents:                            # PDF via Docling (ТЗ S1)
  models_dir: "~/.cache/docling/models"   # docling-tools models download layout tableformer easyocr --easyocr-lang ru --easyocr-lang en
  device: auto                        # auto | cpu | cuda
  ocr: auto                           # auto: OCR only when pages have no text layer | always | never
  ocr_langs: ["ru", "en"]
  min_text_chars: 30                  # fewer extractable characters on a page = scanned page
  table_mode: accurate                # TableFormer: accurate | fast

embedding:
  model: BAAI/bge-m3
  device: auto                        # auto | cuda | cpu
  fp16: true
  batch_size: 16
  max_length: 1024
  pooling: cls                        # cls | mean
  local_files_only: true              # never download at runtime: models come from the local HF cache

retrieval:
  mode: dense                         # dense | sparse | hybrid (sparse needs BGE-M3)
  top_k: 6
  symbols: true                       # exact-name channel for identifiers in the question (RRF after reranking)
  rerank: true                        # cross-encoder over the first-stage candidates
  rerank_model: BAAI/bge-reranker-v2-m3
  rerank_pool: 40
  rerank_max_length: 512
  rerank_batch_size: 16

llm:
  provider: ollama                    # ollama | openai (any OpenAI-compatible endpoint)
  model: qwen3.5:9b
  base_url: http://localhost:11434
  api_key_env: null                   # env var with the API key for provider=openai
  temperature: 0.0
  think: false
  num_ctx: 16384
  max_tokens: 1024
  timeout_s: 300

generation:
  max_source_chars: 2500              # per retrieved fragment in the prompt

reasoning:                            # ТЗ ч.2 S15
  mode: auto                          # off | on | auto: the router asks for reasoning on comparisons, "why", multi-fact questions
  budget_tokens:                      # hard caps by the router's difficulty estimate: an unfinished
    light: 512                        #   reasoning is cut and the answer is forced (budget forcing);
    deep: 1536                        #   "on" uses the deep budget unless the router estimated otherwise
  escalate: true                      # auto: retry an ungrounded fast answer with deep reasoning

catalog:                              # ТЗ S6: relational catalog + text-to-SQL
  extract: true                       # LLM extraction of experiments / metrics / hyperparameters after indexing
  sql: true                           # aggregate questions ("best", "how many", "all runs") also query the catalog
  max_rows: 50                        # forced LIMIT
  timeout_s: 5
  attempts: 3                         # self-correction on an SQL error or an empty result
  examples: null                      # YAML list of {question, sql}: your own few-shot examples

agent:                                # ТЗ S7: ReAct agent + CRAG
  mode: auto                          # auto: aggregate / multi-step questions use the agent, simple ones direct retrieval
  max_steps: 8
  max_generated_tokens: 6000          # tokens of tool calls over the whole trajectory
  timeout_s: 60                       # then the agent answers from the evidence it has
  crag: true                          # relevance check of retrieved fragments (reranker score)
  crag_upper: 0.5                     # >= upper: relevant
  crag_lower: 0.1                     # < lower: rewrite the query; still low after the retries -> honest refusal
  crag_retries: 1

uploads:                              # ТЗ ч.2 S16: files uploaded into a conversation
  max_mb: 50
  ttl_hours: 24                       # session scope; "add to corpus" is an explicit action
  route: self_route                   # whole | index | self_route (whole if it fits, else retrieval, then the whole file in parts)
  context_share: 0.33                 # a file up to a third of llm.num_ctx goes into the context whole
  top_k: 8

code:                                 # ТЗ ч.2 S17: code agent in a Docker sandbox
  image: rag-sandbox:py312            # docker build -t rag-sandbox:py312 -f docker/sandbox.Dockerfile docker
  timeout_s: 120                      # per run; no network, read-only root, uid 1000, limits below
  memory: 2g
  cpus: 2
  max_iterations: 5                   # failed runs the agent may fix from the execution feedback
  max_steps: 20
  aci: true                           # view / search / edit with syntax check (false: overwrite whole files)
  workspace_max_mb: 50                # text files of the corpus copied into the git working copy

web:                                  # ТЗ ч.2 S19: web gateway through a local SearXNG (rag searxng start)
  mode: "off"                         # off | auto (temporal / external questions, irrelevant corpus results) | always
  searxng_url: http://127.0.0.1:8888
  pages: 3                            # pages read per question; main text extracted, cached for cache_days
  cache_days: 7

tracing:
  enabled: true
  log_prompts: true                   # traces stay local, inside storage.data_dir

evaluation:
  judge_model: qwen3.6:27b            # same provider as llm; ideally a different family than the generator
  judge_think: false
  retrieval_k: 10                     # depth for Recall@k / MRR / nDCG@10
  bootstrap: 1000                     # resamples for confidence intervals
  output_dir: runs/eval               # relative to the repo; not committed

api:
  host: 127.0.0.1
  port: 8765
