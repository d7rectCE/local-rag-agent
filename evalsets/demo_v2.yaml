    class: Q1
    question: Какой patience по умолчанию у EarlyStopping и что считается улучшением метрики?
    answer: patience = 5 по умолчанию; улучшение — рост метрики больше чем на min_delta = 1e-4 (ml_toolkit/trainer.py, EarlyStopping).
    must_include: ['\b5\b']
    sources:
      - {file: ml_toolkit/trainer.py, lines: [139, 158]}

  - id: q1-14
    class: Q1
    question: Как считается learning rate в cosine_lr после прогрева?
    answer: lr = min_lr + 0.5 * (base_lr - min_lr) * (1 + cos(pi * t)), где t — доля эпох после прогрева; первые warmup_epochs = 3 эпохи LR растёт линейно; min_lr = 1e-5.
    must_include: ['cos']
    sources:
      - {file: ml_toolkit/trainer.py, lines: [53, 63]}

  - id: q1-15
    class: Q1
    question: Сколько бинов по умолчанию использует expected_calibration_error и как они строятся?
    answer: 15 бинов равной ширины по уверенности (максимальной вероятности); ECE — средневзвешенное |accuracy − confidence| по бинам.
    must_include: ['15']
    sources:
      - {file: ml_toolkit/evaluation.py, lines: [70, 91]}

  - id: q1-16
    class: Q1
    question: Какие квантили по умолчанию использует OutlierClipper?
    answer: Нижний 0.01 и верхний 0.99 (1% и 99%), считаются на train по каждому признаку.
    must_include: ['0[.,]01|1\s?%', '0[.,]99|99\s?%']
    sources:
      - {file: ml_toolkit/preprocessing.py, lines: [11, 30]}

