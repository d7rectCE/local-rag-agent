# Эталонный набор вопросов для публичного демо-корпуса (ТЗ 5.1, S9), версия 2 (Э3):
# вопросы v1 без изменений + 16 вопросов по длинным модулям (trainer, evaluation, preprocessing,
# hparam_search) и ноутбуку 08_numpy_mlp — для проверки H1 (AST-чанкинг) и H2.
#
# Формат одного вопроса:
#   id            уникальный идентификатор
#   class         Q1 фактологический | Q2 навигационный по коду | Q3 агрегатный | Q4 визуальный
#                 Q5 многошаговый | Q6 неотвечаемый (ожидается отказ) | G общий вопрос без файлов
#   question      вопрос пользователя
#   history       (необязательно) предыдущие реплики для уточняющих вопросов
#   standalone    (необязательно) самостоятельная формулировка вопроса с историей — для оценки поиска
#   answer        эталонный ответ (для LLM-судьи); для Q6 не задаётся
#   must_include  регулярные выражения (без учёта регистра), которые обязаны встретиться в ответе
#   sources       эталонные источники: {file, cell} для ноутбуков (ячейки с 1) или {file, lines: [начало, конец]}
#                 для .py. Найденный фрагмент релевантен, если он из того же файла и той же ячейки или его
#                 строки пересекаются с диапазоном — поэтому разметка не зависит от способа чанкинга.
#
# Пропорции классов Q1–Q6 — как в ТЗ (25/15/15/15/15/15 %), плюс класс G для проверки маршрутизатора.

version: 2
name: demo_v2
corpus: ../demo_corpus

items:
  # ---------------------------------------------------------------- Q1: фактологические
  - id: q1-01
    class: Q1
    question: Какой learning rate использовался в эксперименте с аугментациями?
    answer: learning_rate_init = 3e-3 (0.003) для MLP в 04_digits_augmentation; одинаковый для вариантов с аугментацией и без.
    must_include: ['3e-3|0[.,]003']
    sources:
      - {file: experiments/04_digits_augmentation.ipynb, cell: 5}

