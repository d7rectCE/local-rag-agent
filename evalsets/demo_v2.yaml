  # ---------------------------------------------------------------- G: общие вопросы (маршрутизатор)
  - id: g-01
    class: G
    question: Что такое ROC-AUC и как его интерпретировать?
    answer: Площадь под ROC-кривой (TPR против FPR по всем порогам); вероятность, что случайный положительный объект получит больший скор, чем отрицательный; 0.5 — случайное угадывание, 1 — идеальное ранжирование.

  - id: g-02
    class: G
    question: Чем L1-регуляризация отличается от L2?
    answer: L1 штрафует сумму модулей весов и зануляет часть весов (отбор признаков); L2 штрафует сумму квадратов и равномерно уменьшает веса, устойчивее при коррелированных признаках.

  - id: g-03
    class: G
    question: Напиши функцию на Python, которая считает скользящее среднее списка с окном k.
    answer: Корректная функция, возвращающая средние по окнам длины k (например, через накопленные суммы или срезы), с разумной обработкой k больше длины списка.

  - id: g-04
    class: G
    question: Привет! Что ты умеешь?
    answer: Приветствие и описание возможностей — ответы на вопросы по файлам пользователя со ссылками на источники и на общие вопросы.

  - id: g-05
    class: G
    question: Explain the difference between precision and recall.
    answer: Precision = TP / (TP + FP) — share of predicted positives that are correct; recall = TP / (TP + FN) — share of actual positives that are found; trade-off via the decision threshold.

  - id: g-06
    class: G
    question: Как в общих чертах работает градиентный бустинг?
    answer: Ансамбль слабых моделей (обычно деревьев), которые обучаются последовательно; каждая следующая аппроксимирует антиградиент функции потерь (для MSE — остатки) предыдущего ансамбля, вклад масштабируется learning rate.

  - id: g-07
    class: G
    question: Переведи на английский «матрица ошибок».
    answer: confusion matrix.

  - id: g-08
    class: G
    question: Что такое стратифицированное разбиение выборки?
    answer: Разбиение, при котором доли классов в каждой части (train/val/test) такие же, как во всей выборке.

