  - id: q8-07
    class: Q8
    question: Почему в wine_clustering выбрали k=3 и можно ли было выбирать число кластеров по ARI?
    answer: k=3 даёт максимальный силуэт (0.2849 против 0.2683 при k=2 и меньше при k≥4), и при нём ARI с настоящими сортами 0.8975. Выбирать k по ARI нельзя в честной постановке без учителя — ARI требует истинных меток; силуэт их не использует, а ARI служит лишь проверкой. Стандартизация важна из-за разного масштаба признаков.
    must_include: ['0[.,]2849|силуэт|silhouette', 'метк|label']
