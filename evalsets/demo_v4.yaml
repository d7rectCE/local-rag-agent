  # ---------------------------------------------------------------- Q2: навигационные по коду
  - id: q2-01
    class: Q2
    question: Где реализована функция подсчёта F1?
    answer: В ml_toolkit/metrics.py — функция calc_metrics (F1 через sklearn f1_score, macro по умолчанию); устаревшая ручная реализация f1_manual — в scripts/legacy_metrics.py.
    must_include: ['calc_metrics']
    sources:
