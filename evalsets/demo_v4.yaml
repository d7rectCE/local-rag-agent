  # ---------------------------------------------------------------- Q5: многошаговые
  - id: q5-01
    class: Q5
    question: Сравни, как подбираются гиперпараметры в 03_gradient_boosting и 06_diabetes_regression.
    answer: В обоих перебирается один гиперпараметр по сетке на валидации, затем финальная модель один раз оценивается на тесте. В 03 — learning_rate из [0.01, 0.03, 0.05, 0.1, 0.3] по ROC-AUC (затем F1), лучший 0.3; в 06 — alpha Ridge из [0.01 … 100] по RMSE, лучший 0.01.
    sources:
      - {file: experiments/03_gradient_boosting.ipynb, cell: 5}
      - {file: experiments/03_gradient_boosting.ipynb, cell: 8}
      - {file: experiments/06_diabetes_regression.ipynb, cell: 5}
      - {file: experiments/06_diabetes_regression.ipynb, cell: 6}

  - id: q5-02
    class: Q5
    question: Использует ли скрипт train.py ту же функцию метрик, что и ноутбуки, и куда он записывает результаты?
    answer: Да, calc_metrics (accuracy, F1 macro, ROC-AUC на валидации); результаты дописываются функцией log_run в JSONL-журнал runs/runs.jsonl и печатаются.
    must_include: ['calc_metrics', 'runs']
    sources:
      - {file: scripts/train.py, lines: [47, 56]}
      - {file: ml_toolkit/utils.py, lines: [18, 24]}

  - id: q5-03
    class: Q5
    question: Чем f1_manual отличается от F1 в calc_metrics?
    answer: f1_manual — ручной бинарный F1 для одного положительного класса без sklearn (устарел); calc_metrics считает F1 через sklearn f1_score с усреднением macro по умолчанию и работает для многоклассовых задач.
    must_include: ['macro']
    sources:
      - {file: scripts/legacy_metrics.py, lines: [19, 26]}
      - {file: ml_toolkit/metrics.py, lines: [13, 27]}

  - id: q5-04
    class: Q5
    question: Почему в черновике упала ячейка с f1_manual и как это исправить?
    answer: NameError — f1_manual не импортирована в ноутбук; она лежит в scripts/legacy_metrics.py, нужно импортировать её оттуда или использовать calc_metrics.
    must_include: ['NameError|не импорт|not defined|не определ']
    sources:
      - {file: experiments/07_scratch.ipynb, cell: 4}
      - {file: experiments/07_scratch.ipynb, cell: 5}

  - id: q5-05
    class: Q5
    question: How does the digits augmentation change the training set size, and which function implements the shifts?
    answer: 1077 → 5385 samples (original plus 4 one-pixel shifts, ×5); augment_digits in ml_toolkit/features.py, using shift_image and DEFAULT_SHIFTS.
    must_include: ['5385', 'augment_digits|shift_image']
    sources:
      - {file: experiments/04_digits_augmentation.ipynb, cell: 7}
      - {file: ml_toolkit/features.py, lines: [9, 9]}
      - {file: ml_toolkit/features.py, lines: [33, 41]}

