  - id: q8-13
    class: Q8
    question: Рецензент просит проверить аугментацию поворотами. Учтено ли это в планах и почему повороты стоит проверять отдельно от сдвигов?
    answer: Да — в заметках на апрель есть пункт попробовать повороты на digits (±10°) и сравнить со сдвигами, в статье повороты оставлены на будущее. Повороты дают другую инвариантность, чем сдвиги (MLP не инвариантен ни к одной из них), и на изображениях 8x8 сильно искажают цифры, поэтому эффект нужно мерить отдельно.
    must_include: ['10']
    sources:
      - {file: docs/report_march.docx, quote: 'поворот'}
      - {file: notes/ideas_april.txt, lines: [3, 3]}
      - {file: papers/shift_augmentation_note.pdf, page: 1}

  - id: q8-14
    class: Q8
    question: Можно ли по результатам 03_gradient_boosting утверждать, что learning rate 0.3 лучше 0.05?
    answer: Нет. ROC-AUC 0.9928 против 0.9925 — разница 0.0003; accuracy 0.9649 против 0.9561 на валидации из 114 объектов — это ровно один объект. Такая разница в пределах шума одного разбиения; нужна кросс-валидация или доверительные интервалы. На тесте модель с lr 0.3 получила ROC-AUC 0.9904.
    must_include: ['0[.,]9928|0[.,]9925', 'один|1 объект|1 пример|шум|значим|случайн']
    sources:
      - {file: experiments/03_gradient_boosting.ipynb, cell: 5}
      - {file: experiments/02_logreg_baseline.ipynb, cell: 3}

  - id: q8-15
    class: Q8
    question: Почему в hparam_search конфигурации оцениваются кросс-валидацией, а в ноутбуках 02 и 03 — на фиксированной валидации, и к чему это приводит?
    answer: hparam_search сравнивает много случайных конфигураций, и каждую оценивает стратифицированной 5-fold кросс-валидацией (среднее и std по фолдам), что устойчивее к шуму одного разбиения, но в 5 раз дороже. В 02 и 03 используется одно разбиение 60/20/20 с валидацией из 114 объектов, где разница между конфигурациями в один объект — это шум, а выбор по валидации может переобучиться под неё; тест при этом используется один раз.
    must_include: ['кросс-валидац|cross-validat|фолд|fold']
    sources:
      - {file: scripts/hparam_search.py, lines: [53, 62]}
      - {file: ml_toolkit/evaluation.py, lines: [28, 40]}
      - {file: experiments/03_gradient_boosting.ipynb, cell: 5}

  - id: q8-16
    class: Q8
    question: Почему в логе обучения numpy-MLP learning rate на первых эпохах растёт, а потом падает?
    answer: Используется cosine_lr с линейным прогревом warmup_epochs=3 — первые три эпохи lr растёт до базового (0.00167, 0.00333, 0.005), затем убывает по косинусу к min_lr (к эпохе 37 — около 0.003).
    must_include: ['прогрев|warmup']
    sources:
      - {file: ml_toolkit/trainer.py, lines: [53, 63]}
