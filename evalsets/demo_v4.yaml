  - id: q8-06
    class: Q8
    question: Корректно ли сравнивать ручной MLP из 08 с MLPClassifier из 04 по цифрам, которые приведены в ноутбуках и отчёте?
    answer: Не вполне. Данные и разбиение те же (digits, seed=0), но для 08 в отчёте приведены метрики на тесте (accuracy 0.9528, F1 0.9527, ROC-AUC 0.9947), а для 04 — только на валидации (0.9722 / 0.9778); тест в 04 не считался. На валидации лучший результат 08 — 0.9639, то есть ниже MLPClassifier. Корректно сравнивать на одной выборке.
