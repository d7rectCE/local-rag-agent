  - id: q8-01
    class: Q8
    question: Почему градиентный бустинг не обогнал логистическую регрессию на breast cancer? Опирайся на цифры и на то, как устроены данные.
    answer: На валидации у логрегрессии ROC-AUC 0.998 и F1 0.9906, у лучшего HistGradientBoosting (lr=0.3) — 0.9928 и 0.9627. Задача близка к линейно разделимой (признаки формы опухоли сильно коррелируют с таргетом, до −0.79 у worst concave points), поэтому у бустинга нет преимущества; кроме того, валидация всего 114 примеров, и разница — несколько объектов (95% CI F1 логрегрессии [0.970, 1.000]).
    must_include: ['0[.,]998', '114|линейн|linear|мал']
    sources:
