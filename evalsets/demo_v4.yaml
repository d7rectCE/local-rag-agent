  - id: p-q1-03
    class: Q1
    question: Чем L1-регуляризация отличается от L2 по конспекту лекции?
    answer: L1 (lasso) штрафует сумму модулей весов и зануляет часть весов — отбор признаков, из коррелированных выбирает один; L2 (ridge) штрафует сумму квадратов, сжимает веса без обнуления, делит вес между коррелированными признаками и имеет аналитическое решение.
    must_include: ['нул|разрежен']
    sources:
      - {file: papers/lecture_regularization.pdf, page: 1}

  - id: p-q1-04
    class: Q1
    question: Что в конспекте лекции сказано про weight decay и Adam?
    answer: Для SGD L2-штраф эквивалентен weight decay (веса умножаются на 1 − η·λ), для адаптивных оптимизаторов вроде Adam — нет, поэтому используют AdamW с отделённым weight decay.
    must_include: ['AdamW']
    sources:
      - {file: papers/lecture_regularization.pdf, page: 1}

