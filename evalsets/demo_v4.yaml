    answer: В scripts/train.py (функция main) и в ноутбуках 02_logreg_baseline (ячейка 6), 03_gradient_boosting (ячейки 5 и 8), 04_digits_augmentation (ячейки 6 и 7), 07_scratch (ячейка 3).
    must_include: ['train\.py']
    sources:
