  - id: q8-04
    class: Q8
    question: Почему сдвиговая аугментация полезна именно для MLP и насколько она помогла на digits?
    answer: У полносвязной сети, в отличие от свёрточной, нет встроенной инвариантности к сдвигам, поэтому её приходится выучивать из данных; сдвиги на 1 пиксель в четыре стороны увеличивают обучающую выборку в 5 раз (1077 → 5385). Accuracy на валидации выросла с 0.9722 до 0.9778, macro F1 — с 0.9722 до 0.9781.
    must_include: ['инвариант|invarian|свёрточн|сверточн|convolution', '0[.,]9778']
    sources:
      - {file: papers/shift_augmentation_note.pdf, page: 1}
      - {file: experiments/04_digits_augmentation.ipynb, cell: 7}

  - id: q8-05
    class: Q8
    question: Почему в 06_diabetes_regression лучшим оказался самый слабый alpha у Ridge и что это говорит о модели?
    answer: RMSE почти не меняется от alpha=0.01 до 1 (53.549–53.631) и заметно растёт только при 100 (55.851, R² 0.471). Модель — линейная на 10 стандартизованных признаках, у неё низкая дисперсия, поэтому регуляризация почти не нужна и сильный штраф только добавляет смещение; выбран alpha=0.01. На тесте R² 0.426 — ниже валидационного 0.514, что при 89 объектах в выборках объяснимо разбросом.
    must_include: ['0[.,]01', 'смещен|недообуч|дисперс|bias|variance|почти не|слаб']
    sources:
