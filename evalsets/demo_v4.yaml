    class: Q5
    question: Лучше ли бустинг, чем логистическая регрессия на breast cancer, если сравнивать на валидации?
    answer: Нет. Логистическая регрессия — ROC-AUC 0.998 и F1 0.9906 на валидации; лучший HistGradientBoosting (lr=0.3) — ROC-AUC 0.9928 и F1 0.9627.
    must_include: ['0[.,]998']
    sources:
      - {file: experiments/02_logreg_baseline.ipynb, cell: 6}
      - {file: experiments/03_gradient_boosting.ipynb, cell: 5}

