  - id: q8-10
    class: Q8
    question: Какие сроки есть в моих заметках и в протоколе встречи, и какой срок сдачи наступает раньше всех?
    answer: В заметках — дедлайн отчёта за апрель 15 апреля; в протоколе — глава 2 диссертации к 10 апреля, демо системы поиска к 25 апреля, следующая встреча 3 апреля в 15:00. Самый ранний срок сдачи — глава 2 к 10 апреля (встреча 3 апреля — не сдача).
    must_include: ['10 апреля']
    sources:
      - {file: notes/ideas_april.txt, lines: [8, 8]}
      - {file: papers/meeting_notes_scan.pdf, page: 1}

  - id: q8-11
    class: Q8
    question: Почему в черновике calc_metrics выдал F1 0.7333 при accuracy 0.75?
    answer: calc_metrics считает F1 с усреднением macro. Для y_true [0,1,1,0] и y_pred [0,1,0,0] F1 класса 0 = 0.8 (precision 2/3, recall 1), класса 1 = 0.667 (precision 1, recall 0.5); среднее 0.7333, тогда как accuracy — 3 из 4 = 0.75.
    must_include: ['macro']
    sources:
      - {file: experiments/07_scratch.ipynb, cell: 3}
      - {file: ml_toolkit/metrics.py, lines: [13, 27]}

  - id: q8-12
    class: Q8
    question: Какое значение weight decay правили в отчёте и согласуется ли итоговое значение с кодом эксперимента 08?
    answer: В разделе о переобучении правкой удалено 5e-4 и вставлено 1e-3 (увеличили weight decay с 1e-4). В 08_numpy_mlp и в логе обучения weight_decay = 1e-3 (0.001), то есть итоговая редакция отчёта совпадает с кодом, а удалённое 5e-4 — нет.
    must_include: ['1e-3|0[.,]001', '5e-4|0[.,]0005']
    sources:
