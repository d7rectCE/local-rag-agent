      - {file: experiments/02_logreg_baseline.ipynb, cell: 6}
      - {file: experiments/03_gradient_boosting.ipynb, cell: 5}
      - {file: experiments/03_gradient_boosting.ipynb, cell: 8}
      - {file: experiments/04_digits_augmentation.ipynb, cell: 6}
      - {file: experiments/04_digits_augmentation.ipynb, cell: 7}
