# Эталонный набор вопросов для публичного демо-корпуса (ТЗ 5.1, S9; ТЗ ч.2 5.1), версия 4 (Э12):
# вопросы v3 без изменений + 16 вопросов класса Q8 «требующий рассуждения» (ТЗ ч.2: 15–20 вопросов;
# ответ невозможен без сопоставления нескольких фактов и вывода).
#
# Версия 3 (Э4, Э11):
# вопросы v2 без изменений + 22 вопроса по документам: DOCX (разделы, таблица, правки, комментарий,
# рисунок), PDF (двухколоночная статья, конспект, скан для OCR), TXT (заметки в cp1251, лог обучения,
# табличная выгрузка).
#
# Формат одного вопроса:
#   id            уникальный идентификатор
#   class         Q1 фактологический | Q2 навигационный по коду | Q3 агрегатный | Q4 визуальный
#                 Q5 многошаговый | Q6 неотвечаемый (ожидается отказ) | Q8 требующий рассуждения
#                 G общий вопрос без файлов
#   question      вопрос пользователя
#   history       (необязательно) предыдущие реплики для уточняющих вопросов
#   standalone    (необязательно) самостоятельная формулировка вопроса с историей — для оценки поиска
#   answer        эталонный ответ (для LLM-судьи); для Q6 не задаётся
#   must_include  регулярные выражения (без учёта регистра), которые обязаны встретиться в ответе
#   sources       эталонные источники: {file, cell} для ноутбуков (ячейки с 1), {file, lines: [начало, конец]}
#                 для .py и текстов, {file, page}, {file, section} для PDF и DOCX (section — подстрока
#                 самого вложенного заголовка). Найденный фрагмент релевантен, если он из того же файла и той же ячейки или его
#                 строки пересекаются с диапазоном — поэтому разметка не зависит от способа чанкинга.
#
# Пропорции классов Q1–Q6 — как в ТЗ (25/15/15/15/15/15 %), плюс класс G для проверки маршрутизатора.

version: 4
name: demo_v4
corpus: ../demo_corpus

items:
  # ---------------------------------------------------------------- Q1: фактологические
  - id: q1-01
    class: Q1
    question: Какой learning rate использовался в эксперименте с аугментациями?
    answer: learning_rate_init = 3e-3 (0.003) для MLP в 04_digits_augmentation; одинаковый для вариантов с аугментацией и без.
    must_include: ['3e-3|0[.,]003']
    sources:
      - {file: experiments/04_digits_augmentation.ipynb, cell: 5}

  - id: q1-02
    class: Q1
    question: Какой ROC-AUC получила логистическая регрессия на валидации?
    answer: ROC-AUC = 0.998 на валидации (accuracy 0.9912, F1 0.9906), ноутбук 02_logreg_baseline.
    must_include: ['0[.,]998']
    sources:
      - {file: experiments/02_logreg_baseline.ipynb, cell: 6}

  - id: q1-03
    class: Q1
    question: Сколько объектов в train, val и test у датасета digits?
    answer: train 1077, val 360, test 360.
    must_include: ['1077', '360']
    sources:
      - {file: experiments/04_digits_augmentation.ipynb, cell: 3}

  - id: q1-04
    class: Q1
    question: Какой learning rate выбран для финальной модели HistGradientBoosting и какой у неё ROC-AUC на тесте?
    answer: learning_rate = 0.3; на тесте ROC-AUC 0.9904 (accuracy 0.9298, F1 0.9246).
    must_include: ['0[.,]3\b', '0[.,]9904']
    sources:
      - {file: experiments/03_gradient_boosting.ipynb, cell: 8}

  - id: q1-05
    class: Q1
    question: What adjusted Rand index did KMeans with k=3 reach on the wine dataset?
    answer: ARI = 0.8975 against the true cultivar labels.
    must_include: ['0[.,]8975']
    sources:
      - {file: experiments/05_wine_clustering.ipynb, cell: 6}

  - id: q1-06
    class: Q1
    question: What was the test RMSE of the final ridge regression model?
    answer: Test RMSE = 53.438 (R² = 0.426) with the best alpha = 0.01.
    must_include: ['53[.,]438']
    sources:
      - {file: experiments/06_diabetes_regression.ipynb, cell: 6}

  - id: q1-07
    class: Q1
    question: Сколько доброкачественных и злокачественных опухолей в датасете breast cancer?
    answer: 357 доброкачественных (target = 1) и 212 злокачественных (target = 0).
    must_include: ['357', '212']
    sources:
      - {file: experiments/01_eda_breast_cancer.ipynb, cell: 5}
      - {file: experiments/01_eda_breast_cancer.ipynb, cell: 4}

  - id: q1-08
    class: Q1
    question: Какой признак сильнее всего коррелирует с таргетом в breast cancer?
    answer: worst concave points, корреляция −0.7936 (отрицательная).
    must_include: ['worst concave points']
    sources:
      - {file: experiments/01_eda_breast_cancer.ipynb, cell: 7}

  - id: q1-09
    class: Q1
    question: Какие значения по умолчанию у аргументов --lr и --max-iter в скрипте обучения?
    answer: --lr по умолчанию 0.1, --max-iter по умолчанию 200 (scripts/train.py, parse_args).
    must_include: ['0[.,]1\b', '200']
    sources:
      - {file: scripts/train.py, lines: [25, 34]}

  - id: q1-10
    class: Q1
    question: Какой доверительный интервал для F1 получился у логистической регрессии?
    answer: 95% бутстреп-интервал для macro F1 — [0.970, 1.000].
    must_include: ['0[.,]97']
    sources:
      - {file: experiments/02_logreg_baseline.ipynb, cell: 7}

  - id: q1-11
    class: Q1
    history:
      - {role: user, content: 'Какие эксперименты у меня есть на датасете digits?'}
      - {role: assistant, content: 'На digits есть эксперимент 04_digits_augmentation: MLP с аугментацией сдвигами и без неё.'}
    question: А какая там получилась accuracy с аугментацией?
    standalone: Какая accuracy получилась у MLP с аугментацией в эксперименте на digits?
    answer: С аугментацией accuracy 0.9778 на валидации (без аугментации 0.9722).
    must_include: ['0[.,]9778']
    sources:
      - {file: experiments/04_digits_augmentation.ipynb, cell: 7}
      - {file: experiments/04_digits_augmentation.ipynb, cell: 8}

  - id: q1-12
    class: Q1
    question: С каким seed разбивается датасет diabetes и используется ли стратификация?
    answer: seed=7, stratify=False (без стратификации), 06_diabetes_regression.
