  - id: q8-02
    class: Q8
    question: Почему step-расписание в numpy-MLP оказалось хуже constant и cosine? Сопоставь код расписания с таблицей сравнения.
    answer: step_lr умножает learning rate на gamma=0.5 каждые step_size=10 эпох, так что к эпохе 10 он 0.0025, к 20 — 0.00125. При базовом lr 0.005 и 40 эпохах обучение слишком рано замедляется, и сеть не успевает дойти до лучшего качества — best_val_acc 0.95 (лучшая эпоха 18, остановка 28) против 0.9639 у constant и 0.9583 у cosine.
    must_include: ['0[.,]5|gamma|вдвое|в 2 раза|в два раза|половин', '0[.,]95\b|0[.,]9500']
    sources:
      - {file: ml_toolkit/trainer.py, lines: [48, 50]}
      - {file: experiments/08_numpy_mlp.ipynb, cell: 8}

  - id: q8-03
    class: Q8
    question: Переобучился ли ручной MLP в 08_numpy_mlp и что сделано против этого в коде и в отчёте?
    answer: После ~30-й эпохи train loss продолжает падать (до 0.069 к эпохе 37), а accuracy на валидации держится на 0.9639 с эпохи 27 — рост на валидации прекратился (val loss при этом ещё немного снижается, так что это скорее насыщение). Меры — ранняя остановка с patience 10 (остановка на эпохе 37 с восстановлением весов лучшей эпохи 27), weight decay 1e-3 и lr 0.005.
    must_include: ['27', 'patience|ранн[а-я]+ остановк|early stop']
