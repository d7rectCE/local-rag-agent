  - id: q8-09
    class: Q8
    question: Как проверить, что прирост от аугментации в 04 не случаен, и что для этого уже есть в ml_toolkit?
    answer: Прирост accuracy 0.9722 → 0.9778 на 360 валидационных объектах — это всего 2 объекта. Нужна оценка неопределённости — бутстреп-интервал (bootstrap_ci в ml_toolkit.metrics, уже используется в 02) или парный тест на тех же объектах (парный бутстреп, McNemar), а лучше — несколько сидов разбиения и обучения.
    must_include: ['bootstrap|бутстр[еэ]п']
