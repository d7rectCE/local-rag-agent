  - id: q8-08
    class: Q8
    question: Как воспроизвести лучший бустинг из 03_gradient_boosting через scripts/train.py и совпадут ли метрики?
    answer: python scripts/train.py --dataset breast_cancer --model hist_gb --lr 0.3 --max-iter 300 --seed 42 даст то же разбиение, но не те же метрики гарантированно — model_params в train.py передаёт только learning_rate, max_iter и random_state, а в ноутбуке ещё max_leaf_nodes=15 и l2_regularization=1.0; без них используются значения по умолчанию. Нужно добавить эти параметры в скрипт. Результат допишется в runs/runs.jsonl.
    must_include: ['max_leaf_nodes|l2_regularization']
