# Вопросы, требующие актуальной внешней информации (ТЗ ч.2: класс Q10, 10–15 вопросов; S19, H15).
# Эталонные ответы верны на дату as_of и проверены по первоисточникам: JSON API PyPI, релизы на GitHub,
# python.org, arXiv. Три вопроса — с ложной предпосылкой, как в FreshQA: правильный ответ её опровергает.
# При повторных прогонах позже даты as_of версии могут устареть — эталон нужно обновить по тем же источникам.

version: 1
name: web_v1
corpus: ../demo_corpus

items:
  - id: q10-01
    class: Q10
    as_of: "2026-09-26"
    question: Какая последняя стабильная версия scikit-learn?
    answer: scikit-learn 1.9.1, выпущена 10 сентября 2026 г.
    must_include: ['1[.,]9[.,]1']

  - id: q10-02
    class: Q10
    as_of: "2026-09-26"
    question: Какая сейчас последняя версия PyTorch?
    answer: PyTorch 2.14.0 (пакет torch на PyPI), выпущена 2 сентября 2026 г.
    must_include: ['2[.,]14']

  - id: q10-03
    class: Q10
    as_of: "2026-09-26"
    question: Какая последняя версия pandas и что главного изменилось в pandas 3.0?
    answer: pandas 3.0.6 (17 сентября 2026 г.). В 3.0 — согласованное поведение копий и представлений через Copy-on-Write по умолчанию, отдельный строковый тип str вместо object для строк, требуется Python 3.11 и новее.
    must_include: ['3[.,]0', 'copy-on-write|copy on write|копировани']

  - id: q10-04
    class: Q10
    as_of: "2026-09-26"
    question: Какая последняя версия NumPy?
